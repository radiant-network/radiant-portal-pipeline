actions:
  - when: after
    do: >-
      Re-create the two staging views. In the base database, run section 1 of the migration file (drop the views),
      then run the Radiant - Init StarRocks Base Tables DAG with the udf_release_version in use. Without this step, the
      deployed views keep the old definition and a case status change still makes the next radiant-import reload the
      case. Then unpause radiant-case-scheduler. No re-import: the rows already in staging_sequencing_experiment are
      never selected again.
    preconditions:
      - No import is running (radiant-import, radiant-import-part, radiant-reannotate-open-data).
      - radiant-case-scheduler is paused, so that no run reads the views between the drop and the DAG run.
    refs:
      - radiant/dags/sql/radiant/migrations/RAD-377_staging_delta_on_task_key.sql
      - radiant-init-starrocks-base-tables
    check: >-
      SHOW CREATE VIEW staging_sequencing_experiment_delta shows no updated_at condition in the LEFT ANTI JOIN, and
      SHOW CREATE VIEW staging_external_sequencing_experiment shows updated_at from the task's created_on and no join
      on cases.
