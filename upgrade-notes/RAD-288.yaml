actions:
  - when: after
    do: >-
      Run radiant-init-starrocks-base-tables before the next radiant-case-scheduler run. It creates the
      pipeline_journal table and the pipeline_state view: the case scheduler writes its germline SNV decisions there,
      and the germline SNV post-processing it starts reads its cases from them.
    preconditions:
      - radiant-case-scheduler is paused, or its next run is after this step. Without the table, the run fails and
        the germline SNV post-processing runs no case.
    refs:
      - radiant-init-starrocks-base-tables
      - radiant/dags/sql/radiant/init/pipeline_journal_create_table.sql
      - radiant/dags/sql/radiant/init/pipeline_state_create_table.sql
    check: SELECT count(*) FROM pipeline_state runs in the base database.
