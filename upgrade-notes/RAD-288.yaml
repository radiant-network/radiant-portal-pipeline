actions:
  - when: after
    do: >-
      Run radiant-init-starrocks-base-tables. It creates the pipeline_journal table and the pipeline_state view,
      where the case scheduler writes its germline SNV decisions. Until then, the scheduler's journal_germline_snv
      task fails and turns the run red; the pipelines run all the same.
    refs:
      - radiant-init-starrocks-base-tables
      - radiant/dags/sql/radiant/init/pipeline_journal_create_table.sql
      - radiant/dags/sql/radiant/init/pipeline_state_create_table.sql
    check: SELECT count(*) FROM pipeline_state runs in the base database.
