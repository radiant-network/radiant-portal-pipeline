version: 2

sources:
  - name: tenant_db
    schema: "{{ env_var('SR_TENANT_SCHEMA', env_var('SR_SCHEMA', 'radiant')) }}"
    tables:
      - name: somatic__cnv__variant_frequency
        tests:
          # --- Should Not Be Empty -------------------------------------------
          # RAD-182: computed from somatic__cnv__occurrence, empty for a tenant without tumor-only tasks.
          - should_not_be_empty:
              name: somatic_cnv_variant_frequency__should_not_be_empty
              expected_if: "{{ tenant_has_task_type('tumor_only_variant_calling') }}"
          # --- Should Be Within Range ----------------------------------------
          # Frequencies must be in [0,1]. The columns start with pf_, so the default `_pf_` misses them.
          - should_be_within_range:
              name: somatic_cnv_variant_frequency__should_be_within_range_pf
              like: pf_
        columns:
          - name: cnv_id
            tests:
              # --- Should Not Contain Null -----------------------------------
              - not_null:
                  name: somatic_cnv_variant_frequency__should_not_contain_null__cnv_id
              # --- Should Be Unique ------------------------------------------
              - unique:
                  name: somatic_cnv_variant_frequency__should_be_unique__cnv_id
