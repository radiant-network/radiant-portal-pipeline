version: 2

sources:
  - name: tenant_db
    schema: "{{ env_var('SR_TENANT_SCHEMA', env_var('SR_SCHEMA', 'radiant')) }}"
    tables:
      - name: germline__cnv__occurrence
        tests:
          # --- Should Not Be Empty -------------------------------------------
          - should_not_be_empty:
              name: germline_cnv_occurrence__should_not_be_empty
          # --- Should Not Contain Only Null ----------------------------------
          - should_not_contain_only_null:
              name: germline_cnv_occurrence__should_not_contain_only_null
              except:
                # Already covered by germline_cnv_occurrence__should_not_contain_null__*
                - part
                - task_id
                - cnv_id
                # Constant by construction
                - svlen
                - cipos
                - ciend
                # Filled on the proband's slivar set only, so NULL in a tenant with no CNV annotation task.
                # mother_name and father_name also stay NULL for a slivar VCF made before FORMAT/OID (BIOINFO-214).
                # parental_origin is guarded per annotation task instead, by
                # germline_cnv_occurrence__validate_annotation_tasks_have_parental_origin (tests/).
                - parental_origin
                - transmission_mode
                - mother_calls
                - mother_cn
                - mother_bc
                - mother_pe
                - mother_sm
                - mother_name
                - father_calls
                - father_cn
                - father_bc
                - father_pe
                - father_sm
                - father_name
                # RAD-181: the CNV Exomiser result, filled on the slivar set only, and only for a case whose CNV
                # post-processing ran Exomiser (a family with a phenopacket). The DRAGEN rows keep them NULL, guarded by
                # germline_cnv_occurrence__validate_alignment_rows_have_no_exomiser (tests/).
                - exomiser_rank
                - exomiser_variant_score
                - exomiser_gene_combined_score
                - exomiser_moi
                - exomiser_acmg_classification
                - exomiser_acmg_evidence

          # --- Should Not Contain Same Value ---------------------------------
          - should_not_contain_same_value:
              name: germline_cnv_occurrence__should_not_contain_same_value
              except:
                # Constant by construction
                - part
                - phased
                - svtype

          # --- Should Be Within Range ----------------------------------------
          # gnomAD frequencies must be in [0,1] (defaults: 0..1)
          - should_be_within_range:
              name: germline_cnv_occurrence__should_be_within_range_gnomad_af
              like: gnomad_af
          - should_be_within_range:
              name: germline_cnv_occurrence__should_be_within_range_gnomad_sf
              like: gnomad_sf

          # --- Should Be Unique ----------------------------------------------
          - dbt_utils.unique_combination_of_columns:
              name: germline_cnv_occurrence__should_be_unique__part_seq_id_task_id_cnv_id
              combination_of_columns:
                - part
                - seq_id
                - task_id
                - cnv_id
        columns:
          - name: part
            tests:
              # --- Should Not Contain Null -----------------------------------
              - not_null:
                  name: germline_cnv_occurrence__should_not_contain_null__part
          - name: task_id
            tests:
              # --- Should Not Contain Null -----------------------------------
              - not_null:
                  name: germline_cnv_occurrence__should_not_contain_null__task_id
          - name: cnv_id
            tests:
              # --- Should Not Contain Null -----------------------------------
              - not_null:
                  name: germline_cnv_occurrence__should_not_contain_null__cnv_id
          - name: chromosome
            description: "VARCHAR(20)."
            tests:
              # --- Accepted Values -------------------------------------------
              # values: dict_chromosome() — see macros/dictionaries.sql
              - accepted_values:
                  name: germline_cnv_occurrence__accepted_values_chromosome
                  values: "{{ dict_chromosome() }}"
                  config:
                    where: "chromosome is not null"
          - name: transmission_mode
            description: "VARCHAR(50). The CNV mode tag that lists the proband, slivar set only."
            tests:
              # --- Accepted Values -------------------------------------------
              # values: dict_cnv_transmission_mode() — see macros/dictionaries.sql
              - accepted_values:
                  name: germline_cnv_occurrence__accepted_values_transmission_mode
                  values: "{{ dict_cnv_transmission_mode() }}"
                  config:
                    where: "transmission_mode is not null"
          - name: parental_origin
            description: "VARCHAR(25). The proband's po_* tag, slivar set only."
            tests:
              # --- Accepted Values -------------------------------------------
              # values: dict_parental_origin() — see macros/dictionaries.sql
              - accepted_values:
                  name: germline_cnv_occurrence__accepted_values_parental_origin
                  values: "{{ dict_parental_origin() }}"
                  config:
                    where: "parental_origin is not null"
          - name: exomiser_acmg_classification
            description: "VARCHAR(300). The CNV Exomiser ACMG classification, slivar set only (RAD-181)."
            tests:
              # --- Accepted Values -------------------------------------------
              # values: dict_exomiser_acmg_classification() — see macros/dictionaries.sql
              - accepted_values:
                  name: germline_cnv_occurrence__accepted_values_exomiser_acmg_classification
                  values: "{{ dict_exomiser_acmg_classification() }}"
                  config:
                    where: "exomiser_acmg_classification is not null"
