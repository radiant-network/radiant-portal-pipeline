# Releases the ETL from its conventional commits, with release-please. On each push to main:
#   - while user-facing commits wait since the last release, it opens or updates one release
#     PR (`chore(main): release <version>`, branch `release-please--branches--main`). Its body
#     is the changelog; the version follows the commit types: a breaking change (`!` or a
#     `BREAKING CHANGE:` footer) is a major, `feat` a minor, `fix`, `perf` and `revert` a
#     patch. The other types alone open no release PR.
#   - when the release PR is merged, it tags the release commit `vX.Y.Z` and creates the
#     GitHub release with the same changelog. The tag starts the three build_and_push
#     workflows, which push the semver images.
# Merging the release PR is the release decision. The Release Gate workflow (required check)
# blocks that merge while a high or critical vulnerability is open.
#
# Upgrade guide (README, "Upgrade guide"): after release-please, the job keeps one comment on
# the open release PR with the actions of the upgrade notes (upgrade-notes/) since the last
# release. The "Upgrade guide" section of a new GitHub release is added by the Upgrade Guide
# Release workflow (upgrade-guide-release.yml), on the release event: a re-run of this job
# would not create the release again, so it could not add a missing section.
#
# Config: release-please-config.json (type `simple`: with no version.txt in the repo, only
# CHANGELOG.md and the manifest change) and .release-please-manifest.json (the last version).
#
# The token is a GitHub App installation token, not the GITHUB_TOKEN: an event created with
# the GITHUB_TOKEN starts no workflow, so the release PR would run no check (and could not
# pass the required ones) and the tag would build no image. The App needs `contents`,
# `issues` and `pull-requests` write on this repo; the token is limited to them.
name: Release

on:
  push:
    branches:
      - main
      # TEMP(RAD-186): test the release PR comment on the feature branch. Revert before the merge.
      - feat/rad-186

# One run at a time. A newer push replaces a run that still waits, which loses nothing: each
# run rebuilds the release PR from all the commits since the last release.
concurrency:
  group: release
  cancel-in-progress: false

# The GITHUB_TOKEN is not used
permissions: {}

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # For the steps that follow a release (upgrade guide): `release_created` and `tag_name`
    # after the merge of the release PR, `pr` (JSON) while it is open.
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      pr: ${{ steps.release.outputs.pr }}

    steps:
      # The org App `radiant-release-please` (org variable RELEASE_PLEASE_APP_CLIENT_ID, org
      # secret RELEASE_PLEASE_APP_PRIVATE_KEY; radiant-hub docs/ci/security-checks.md). It must be
      # installed on this repo with the three write permissions (README, "Release").
      - name: Get a token to open the release PR and tag the release
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_PLEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write

      - name: Open or update the release PR, or tag the release
        id: release
        # TEMP(RAD-186): never run release-please from the feature branch (it acts on main). Revert before the merge.
        if: github.ref == 'refs/heads/main'
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # The full history and the tags, at the pushed commit, after release-please: the tag of a
      # release made by the previous step is fetched too. The App token, because the
      # GITHUB_TOKEN has no permission here; it is not kept in the git config.
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install the upgrade guide's dependencies
        run: pip install -r scripts/upgrade_guide/requirements.txt

      # One comment on the open release PR, found by its branch: the `pr` output is unset on a run
      # that leaves the PR as it is, but a note text corrected on main must still reach the comment.
      # The release-please PR body is not edited: each run rebuilds it. A hidden marker finds the
      # comment of an earlier run.
      - name: Post the upgrade guide on the release PR
        if: steps.release.outputs.release_created != 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          MARKER: '<!-- upgrade-guide -->'
        run: |
          pr=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --head release-please--branches--main \
            --json number,title --jq '.[0] // empty')
          # TEMP(RAD-186): on the feature branch, post on the branch's own PR, never on the release PR.
          # Revert this block (keep the `if [ -z "$pr" ]` below) before the merge.
          if [ "$GITHUB_REF_NAME" != main ]; then
            # The version of the open release PR, if any, names the section as on main
            next_title=""
            if [ -n "$pr" ]; then next_title=$(jq -r .title <<< "$pr"); fi
            pr=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --head "$GITHUB_REF_NAME" \
              --json number --jq '.[0] // empty')
            if [ -n "$pr" ]; then pr=$(jq -c --arg t "$next_title" '. + {title: $t}' <<< "$pr"); fi
          fi
          if [ -z "$pr" ]; then
            echo "No open release PR: no upgrade guide to post."
            exit 0
          fi
          number=$(jq -r .number <<< "$pr")
          # Title `chore(main): release 1.2.0`: the section of the next release is named after it
          version=$(jq -r '.title | split(" ") | last' <<< "$pr")
          if [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then next="v$version"; else next="Next release"; fi
          from=$(git tag --merged HEAD --list 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          {
            echo "$MARKER"
            python -m scripts.upgrade_guide guide --from "$from" --to HEAD --next-version "$next"
            echo
            echo "_Upgrade notes on \`$GITHUB_REF_NAME\` at ${GITHUB_SHA:0:7}. Updated by the Release workflow on each push to \`main\`._"
          } > comment.md
          # The same guide in the job summary, to read it without the PR
          cat comment.md >> "$GITHUB_STEP_SUMMARY"
          # A comment holds at most 65536 characters
          if [ "$(wc -c < comment.md)" -gt 65000 ]; then
            {
              echo "$MARKER"
              echo "The upgrade guide from $from is too long for a comment: run the Upgrade Guide workflow with \`from\` $from and \`to\` main."
            } > comment.md
          fi
          id=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$number/comments" \
            --jq ".[] | select(.user.type == \"Bot\" and (.body | startswith(\"$MARKER\"))) | .id" | head -1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -F body=@comment.md > /dev/null
            echo "Upgrade guide updated on the release PR #$number." >> "$GITHUB_STEP_SUMMARY"
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$number/comments" -F body=@comment.md > /dev/null
            echo "Upgrade guide posted on the release PR #$number." >> "$GITHUB_STEP_SUMMARY"
          fi

      # Also after a failed upgrade guide step: the release itself is done
      - name: Write the result to the job summary
        if: ${{ !cancelled() && steps.release.outcome == 'success' }}
        env:
          RELEASE_CREATED: ${{ steps.release.outputs.release_created }}
          TAG_NAME: ${{ steps.release.outputs.tag_name }}
          PR: ${{ steps.release.outputs.pr }}
        run: |
          if [ "$RELEASE_CREATED" = true ]; then
            echo "Released $TAG_NAME." >> "$GITHUB_STEP_SUMMARY"
          elif [ -n "$PR" ]; then
            echo "Release PR: $(jq -r '"#\(.number) \(.title)"' <<< "$PR")." >> "$GITHUB_STEP_SUMMARY"
          else
            # No user-facing commit since the last release, or the release PR is already up to date
            echo "No release PR opened or updated, no release (see the log of the previous step)." >> "$GITHUB_STEP_SUMMARY"
          fi
