name: Test Pipeline

on:
  pull_request:
    branches: [ "**" ]
env:
  USE_DOCKER_FIXTURES: "true"

jobs:
  run-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install dependencies
        run: make install-dev
      # bgzip and tabix: the IGV tracks tests that sort, compress and index skip without them
      - name: Install htslib tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tabix
      - name: Run static tests
        run: make test-static
      - name: Run unit tests
        run: make test-unit
      - name: Run integration tests
        run: make test-integration
      - name: Run docker tests
        run: make test-docker

  # Rust SNV engine (rust/radiant_vcf, POC): builds the extension, then runs the Rust tests, the parity tests against
  # the Python engine and the SNV integration tests (real upload and `add_files` commit) with the Rust engine. The
  # run-tests job skips all of them: it has no extension.
  rust-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      # `maturin develop` installs into a virtualenv
      - name: Create virtualenv
        run: |
          python -m venv .venv
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$PWD/.venv" >> "$GITHUB_ENV"
      - name: Install dependencies
        run: make install-dev && pip install "maturin==1.16.0"
      # Same toolchain as Dockerfile.radiant.operator
      - name: Install Rust toolchain
        run: rustup toolchain install 1.91.0 --profile minimal && rustup default 1.91.0
      - name: Run Rust and parity tests
        run: make rust-test
      # test_process_task_error injects its error through TableAccumulator.write_files, which the Rust path does not
      # call (rust/radiant_vcf/README.md).
      - name: Run SNV integration tests with the Rust engine
        env:
          RADIANT_SNV_ENGINE: rust
        run: >-
          pytest tests/integration/test_process_germline_snv_vcf.py tests/integration/test_process_somatic_snv_vcf.py
          --deselect tests/integration/test_process_germline_snv_vcf.py::test_process_task_error
