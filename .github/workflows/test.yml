name: Test Pipeline

on:
  pull_request:
    branches: [ "**" ]
env:
  USE_DOCKER_FIXTURES: "true"

jobs:
  run-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install dependencies
        run: make install-dev
      # bgzip and tabix: the IGV tracks tests that sort, compress and index skip without them
      - name: Install htslib tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tabix
      - name: Run static tests
        run: make test-static
      - name: Run unit tests
        run: make test-unit
      - name: Run integration tests
        run: make test-integration
      - name: Run docker tests
        run: make test-docker
